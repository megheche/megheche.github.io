      header { border-top: 4px solid #3982d5; }
      .eyebrow { margin: 0; color: #245f8f; font-size: 0.75rem; font-weight: 700; }
      h1 { margin: 0.5rem 0; color: #0f172a; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.2; }

      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }

      .link {

        padding: 0.45rem 1rem;
        border: 1px solid #c2dbf0;

        top: 1rem;
        width: 2.75rem;
        height: 2.75rem;
        border: 1px solid #c2dbf0;
        border-radius: 999px;
        background: #fff;
        color: #245f8f;
        box-shadow: 0 8px 24px rgb(15 23 42 / 0.15);
        cursor: pointer;
        font-size: 1.1rem;
      }

      body.theme-dark { color: #cbd5e1; background: #0c1524; color-scheme: dark; }
      body.theme-dark header, body.theme-dark footer { border-color: #315173; background: #111c2f; }
      body.theme-dark h1 { color: #f8fafc; }
      body.theme-dark .intro { color: #cbd5e1; }
      body.theme-dark .meta, body.theme-dark figcaption { color: #94a3b8; }
      body.theme-dark .eyebrow, body.theme-dark .link { color: #93c5fd; }
      body.theme-dark .link { border-color: #5b91bd; }
      body.theme-dark .link:hover { background: #1e3a5f; }
      body.theme-dark .theme-toggle { border-color: #bae6fd; background: #e0f2fe; color: #0f172a; }
    </style>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark mode">
      <span aria-hidden="true">☾</span>
    </button>
    <script>
      const themeToggle = document.getElementById('theme-toggle')
      const savedTheme = window.localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      const updateTheme = (darkMode) => {
        document.body.classList.toggle('theme-dark', darkMode)
        themeToggle.querySelector('span').textContent = darkMode ? '☀' : '☾'
        themeToggle.setAttribute('aria-label', darkMode ? 'Switch to light mode' : 'Switch to dark mode')
        themeToggle.setAttribute('title', darkMode ? 'Light mode' : 'Dark mode')
      }
      updateTheme(savedTheme ? savedTheme === 'dark' : prefersDark)
      themeToggle.addEventListener('click', () => {
        const darkMode = !document.body.classList.contains('theme-dark')
        window.localStorage.setItem('theme', darkMode ? 'dark' : 'light')
        updateTheme(darkMode)
      })
    </script>
  </body>
